<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Growth desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
  :root {
    --bg: #EEF1F0; --surface: #FFFFFF; --ink: #1B2430; --muted: #5E6B78; --line: #D3D9DB;
    --accent: #4B3FD6; --accent-ink: #FFFFFF; --high: #B4231A; --medium: #8F5F00; --low: #5E6B78; --ok: #1F7A4D;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14191E; --surface: #1C232A; --ink: #E6EAED; --muted: #96A2AD; --line: #2E3740;
      --accent: #A39BFF; --accent-ink: #14191E; --high: #FF8A7A; --medium: #E3B341; --low: #96A2AD; --ok: #5FD39A;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 400 16px/1.55 "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 860px; margin: 0 auto; padding: 40px 20px 96px; }
  h1, h2, h3, p { margin: 0; }
  a { color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .top { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .top h1 { font-size: 15px; font-weight: 600; }
  .top .when { color: var(--muted); font-size: 14px; }

  .note { margin: 28px 0 36px; }
  .note p { font-size: 22px; line-height: 1.4; font-weight: 500; letter-spacing: -0.01em; max-width: 34em; white-space: pre-wrap; }
  .note p + p { margin-top: 0.6em; }
  .note .hint { font-size: 16px; font-weight: 400; color: var(--muted); letter-spacing: 0; }
  .problem { color: var(--high); font-size: 14px; margin-top: 12px; }

  button {
    font: inherit; font-size: 14px; font-weight: 500; color: var(--ink); cursor: pointer;
    background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px;
  }
  button:hover:not(:disabled) { border-color: var(--ink); }
  button:disabled { opacity: 0.55; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  button.primary:hover:not(:disabled) { filter: brightness(1.1); border-color: var(--accent); }
  input[type="text"] {
    font: inherit; font-size: 14px; color: var(--ink); background: var(--surface);
    border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; flex: 1; min-width: 180px;
  }

  nav { display: flex; gap: 24px; border-bottom: 1px solid var(--line); margin-bottom: 20px; }
  nav button { border: 0; border-radius: 0; padding: 10px 0; font-size: 16px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
  nav button[aria-selected="true"] { color: var(--ink); font-weight: 600; border-bottom-color: var(--ink); }
  nav .count { font-weight: 400; color: var(--muted); margin-left: 4px; }

  .filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
  .filters button { border-radius: 999px; padding: 3px 12px; }
  .filters button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .filters label { margin-left: auto; font-size: 14px; color: var(--muted); display: flex; gap: 6px; align-items: center; }

  .group { font-size: 14px; font-weight: 600; margin: 28px 0 8px; display: flex; align-items: center; gap: 8px; }
  .group::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: currentColor; }
  .group.high { color: var(--high); } .group.medium { color: var(--medium); } .group.low { color: var(--low); }

  .item { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 18px 20px; margin-bottom: 10px; }
  .item.closed { opacity: 0.6; }
  .item h3 { font-size: 18px; line-height: 1.3; font-weight: 600; }
  .meta { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .item .why { margin-top: 10px; max-width: 42em; }
  .do { margin-top: 12px; padding-left: 14px; border-left: 3px solid var(--accent); white-space: pre-wrap; overflow-wrap: anywhere; max-width: 44em; }
  .do b { display: block; font-size: 13px; font-weight: 600; color: var(--muted); }
  .evidence { margin-top: 10px; font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
  .evidence a, .evidence code { margin-right: 10px; }
  code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 0.92em; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  .post { white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 12px; max-width: 40em; }
  .state { font-size: 13px; font-weight: 600; }
  .state.scheduled, .state.done { color: var(--ok); } .state.rejected, .state.dismissed { color: var(--muted); }

  .run h3 { font-size: 16px; }
  .run ul { margin: 6px 0 0; padding-left: 18px; font-size: 14px; }
  .run .label { font-size: 13px; font-weight: 600; color: var(--muted); margin-top: 14px; }
  .empty { color: var(--muted); padding: 28px 0; max-width: 36em; }
  .error { position: sticky; bottom: 16px; background: var(--high); color: #fff; padding: 10px 14px; border-radius: 8px; margin-top: 16px; }
  @media (max-width: 560px) { .note p { font-size: 19px; } main { padding-top: 24px; } }
</style>
</head>
<body>
<main id="app"></main>
<script>
const AREA = { seo: "SEO", geo: "GEO", plg: "PLG", content: "Content" };
const PRIORITY = { high: "Do first", medium: "Worth doing", low: "When there is time" };
const ui = { tab: "todo", area: "all", showClosed: false, dismissing: null, rejecting: null, error: null, busy: false };
let data = null;

function h(tag, props, ...children) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v === false || v == null) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "class") el.className = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of children.flat(Infinity)) if (c != null && c !== false) el.append(c);
  return el;
}

const day = (iso) => new Date(iso).toLocaleDateString(undefined, { day: "numeric", month: "short" });
const dayTime = (iso) => new Date(iso).toLocaleString(undefined, { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
function ago(iso) {
  const mins = Math.round((Date.now() - new Date(iso)) / 60000);
  if (mins < 1) return "just now";
  if (mins < 60) return `${mins} min ago`;
  if (mins < 1440) return `${Math.round(mins / 60)} h ago`;
  return `${Math.round(mins / 1440)} d ago`;
}

async function call(path, body) {
  ui.busy = true; ui.error = null; render();
  try {
    const res = await fetch(path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : undefined);
    const json = await res.json();
    if (!res.ok) throw new Error(json.error || `Request failed (${res.status})`);
    data = json;
  } catch (e) { ui.error = e.message; }
  ui.busy = false; render();
}
const refresh = () => call("/api/state");

function reasonForm(placeholder, label, onSubmit, onCancel) {
  const input = h("input", { type: "text", placeholder, "aria-label": placeholder });
  const form = h("form", { class: "actions", onsubmit: (e) => { e.preventDefault(); onSubmit(input.value.trim()); } },
    input, h("button", { type: "submit" }, label), h("button", { type: "button", onclick: onCancel }, "Cancel"));
  queueMicrotask(() => input.focus());
  return form;
}

function recommendation(r) {
  const open = r.status === "open";
  const evidence = r.evidence.map((e) => /^https?:\/\//.test(e) ? h("a", { href: e, target: "_blank", rel: "noopener noreferrer" }, e.replace(/^https?:\/\//, "")) : h("code", {}, e));
  return h("article", { class: `item${open ? "" : " closed"}` },
    h("h3", {}, r.title),
    h("p", { class: "meta" }, `${AREA[r.area]}, added ${day(r.createdAt)}`, !open && h("span", { class: `state ${r.status}` }, `. ${r.status[0].toUpperCase()}${r.status.slice(1)}${r.dismissReason ? `: ${r.dismissReason}` : ""}`)),
    h("p", { class: "why" }, r.why),
    h("div", { class: "do" }, h("b", {}, "What to change"), r.action),
    evidence.length ? h("p", { class: "evidence" }, evidence) : null,
    ui.dismissing === r.id
      ? reasonForm("Why not? The next check takes this into account", "Dismiss",
          (reason) => { ui.dismissing = null; call(`/api/recommendations/${r.id}`, { status: "dismissed", reason }); },
          () => { ui.dismissing = null; render(); })
      : h("div", { class: "actions" }, open
          ? [h("button", { class: "primary", onclick: () => call(`/api/recommendations/${r.id}`, { status: "done" }) }, "Mark done"),
             h("button", { onclick: () => { ui.dismissing = r.id; render(); } }, "Dismiss")]
          : h("button", { onclick: () => call(`/api/recommendations/${r.id}`, { status: "open" }) }, "Reopen")));
}

function todo() {
  const all = data.recommendations.filter((r) => (ui.showClosed || r.status === "open") && (ui.area === "all" || r.area === ui.area));
  const filters = h("div", { class: "filters" },
    ["all", ...Object.keys(AREA)].map((a) => h("button", { "aria-pressed": String(ui.area === a), onclick: () => { ui.area = a; render(); } }, a === "all" ? "All" : AREA[a])),
    h("label", {}, h("input", { type: "checkbox", checked: ui.showClosed, onchange: (e) => { ui.showClosed = e.target.checked; render(); } }), "Show done and dismissed"));
  if (!all.length) {
    return [filters, h("p", { class: "empty" }, data.recommendations.length
      ? "Nothing open here. New recommendations appear after the next check."
      : data.canReview ? "No recommendations yet. Check the site to get the first list." : "Copy watch.example.json to watch.json, set your site and repos, then restart.")];
  }
  return [filters, Object.keys(PRIORITY).flatMap((p) => {
    const items = all.filter((r) => r.priority === p);
    return items.length ? [h("h2", { class: `group ${p}` }, PRIORITY[p]), ...items.map(recommendation)] : [];
  })];
}

function post(d) {
  const pending = d.status === "pending";
  const past = new Date(d.scheduledAt) <= new Date();
  return h("article", { class: `item${pending ? "" : " closed"}` },
    h("p", { class: "meta" }, `${d.platform}, ${pending ? "planned for" : ""} ${dayTime(d.scheduledAt)}`, !pending && h("span", { class: `state ${d.status}` }, `. ${d.status[0].toUpperCase()}${d.status.slice(1)}${d.rejectionReason ? `: ${d.rejectionReason}` : ""}`)),
    h("p", { class: "post" }, d.content),
    h("p", { class: "meta", style: "margin-top:12px" }, `Why this post: ${d.rationale}`),
    !pending ? null : ui.rejecting === d.id
      ? reasonForm("What should change? The next run reads this", "Reject",
          (reason) => { ui.rejecting = null; call(`/api/drafts/${d.id}/reject`, { reason }); },
          () => { ui.rejecting = null; render(); })
      : h("div", { class: "actions" },
          h("button", { class: "primary", disabled: !data.canPublish || past, title: past ? "The planned time has passed" : null, onclick: () => call(`/api/drafts/${d.id}/approve`, {}) }, "Approve and schedule"),
          h("button", { disabled: !data.canPublish, onclick: () => confirm("Publish this post now?") && call(`/api/drafts/${d.id}/approve`, { now: true }) }, "Publish now"),
          h("button", { onclick: () => { ui.rejecting = d.id; render(); } }, "Reject")));
}

function posts() {
  if (!data.drafts.length) return h("p", { class: "empty" }, "No posts yet. When a check finds something worth announcing, the post appears here for you to approve.");
  return [!data.canPublish && h("p", { class: "meta", style: "margin-bottom:12px" }, "Publishing is off: add POSTIZ_API_KEY to .env to approve posts."), data.drafts.map(post)];
}

function list(label, items) {
  return items.length ? [h("p", { class: "label" }, label), h("ul", {}, items.map((i) => h("li", {}, i)))] : null;
}

function changes() {
  if (!data.runs.length) return h("p", { class: "empty" }, "No checks have run yet.");
  return data.runs.map((r) => h("article", { class: "item run" },
    h("h3", {}, dayTime(r.at)),
    h("p", { class: "meta" }, `${r.pagesChecked} pages checked, ${r.recommendationIds.length} recommendations, ${r.draftIds.length} posts`),
    list("Product changes", r.commits.map((c) => [h("code", {}, c.hash), ` ${c.subject} (${c.repo})`])),
    list("New pages", r.diff.added), list("Removed pages", r.diff.removed),
    list("Changed pages", r.diff.changed.map((c) => `${c.url}: ${c.fields.join(", ")}`)),
    list(`Automatic checks (${r.findings.length})`, r.findings.slice(0, 40).map((f) => `${f.url}: ${f.issue}`)),
    list("Problems", r.problems)));
}

function render() {
  const app = document.getElementById("app");
  if (!data) { app.replaceChildren(h("p", { class: "empty" }, ui.error || "Loading…")); return; }
  const last = data.runs[0];
  const open = data.recommendations.filter((r) => r.status === "open").length;
  const pending = data.drafts.filter((d) => d.status === "pending").length;
  const tabs = [["todo", "To do", open], ["posts", "Posts to review", pending], ["changes", "What changed", null]];
  const scrollY = window.scrollY;
  app.replaceChildren(
    h("header", { class: "top" },
      h("div", {}, h("h1", {}, data.site ? data.site.replace(/^https?:\/\//, "") : "Growth desk"),
        h("p", { class: "when" }, data.review.running ? "Checking the site and recent commits…" : last ? `Last checked ${ago(last.at)}` : "Not checked yet")),
      h("button", { disabled: !data.canReview || data.review.running || ui.busy, onclick: () => call("/api/review", {}) }, data.review.running ? "Checking…" : "Check now")),
    h("section", { class: "note" },
      last ? last.summary.split(/\n{2,}/).map((p) => h("p", {}, p))
           : h("p", { class: "hint" }, "After each check, a short note on what changed and what to do first appears here."),
      data.review.error && h("p", { class: "problem" }, `The last check failed: ${data.review.error}`)),
    h("nav", { role: "tablist" }, tabs.map(([id, label, n]) =>
      h("button", { role: "tab", "aria-selected": String(ui.tab === id), onclick: () => { ui.tab = id; render(); } }, label, n ? h("span", { class: "count" }, n) : null))),
    h("section", {}, ui.tab === "todo" ? todo() : ui.tab === "posts" ? posts() : changes()),
    ...(ui.error ? [h("p", { class: "error", role: "alert" }, ui.error)] : []));
  window.scrollTo(0, scrollY);
}

refresh();
setInterval(() => { if (data && data.review.running && !ui.busy && !ui.dismissing && !ui.rejecting) refresh(); }, 4000);
window.addEventListener("focus", () => { if (!ui.busy && !ui.dismissing && !ui.rejecting) refresh(); });
</script>
</body>
</html>
